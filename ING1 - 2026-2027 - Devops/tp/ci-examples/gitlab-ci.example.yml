workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

react-build:
  image: node:24-bookworm
  before_script:
    - npm install --global bun@1.4.3
  script:
    - bun install --frozen-lockfile
    - bunx --no-install eslint .
    - bun run build
    - test -s dist/index.html
  artifacts:
    name: react-dist
    paths: [dist/]
