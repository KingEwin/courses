server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets versionnés par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ne pas mettre index.html en cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
