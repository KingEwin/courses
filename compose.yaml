services:

  course-network-devops:
    container_name: slidev-network-devops
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        COURSE_DIR: "ING1 - 2026-2027 - Devops"
    image: slidev-network-devops:latest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.course-network-devops.rule=Host(`course-network-devops.hoststack.tech`)"
      - "traefik.http.services.course-network-devops.loadbalancer.server.port=8080"
      - "traefik.http.routers.course-network-devops.entrypoints=https"
      - "traefik.http.routers.course-network-devops.tls=true"
      - "traefik.http.routers.course-network-devops.tls.certresolver=letsencrypt"

networks:
  traefik-proxy:
    external: true
